<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>채점 어드민 - Glovv Manager 시험</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "맑은 고딕", "Malgun Gothic", system-ui, sans-serif;
    background: #1f2330; color: #e6e9f0; margin: 0; padding: 24px 12px;
    line-height: 1.6;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 16px; font-size: 22px; }
  .panel {
    background: #2a2f3e; border-radius: 12px; padding: 20px 24px;
    margin-bottom: 16px; border: 1px solid #3a4055;
  }
  .login { max-width: 420px; margin: 60px auto; text-align: center; }
  .login input {
    width: 100%; padding: 12px 14px; font-size: 16px; border-radius: 8px;
    border: 1px solid #3a4055; background: #1f2330; color: #e6e9f0;
    margin: 12px 0;
  }
  .btn {
    background: #2e75b6; color: #fff; border: 0; padding: 10px 20px;
    border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .btn:hover { background: #225d96; }
  .btn.success { background: #2d8a4e; }
  .btn.success:hover { background: #226e3e; }
  .btn.ghost { background: transparent; color: #97a1b8; border: 1px solid #3a4055; }
  .filter-group {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
  }
  .filter-btn {
    background: transparent; color: #97a1b8; border: 1px solid #3a4055;
    padding: 6px 14px; border-radius: 99px; cursor: pointer; font-size: 13px;
    font-family: inherit;
  }
  .filter-btn.active { background: #2e75b6; color: #fff; border-color: #2e75b6; }
  .filter-btn:hover:not(.active) { border-color: #5a6175; color: #c4ccdb; }
  /* 리스트 */
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #3a4055; font-size: 14px; }
  th { color: #97a1b8; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  tr:hover { background: rgba(255,255,255,0.03); }
  .badge {
    display: inline-block; padding: 3px 9px; border-radius: 99px;
    font-size: 11px; font-weight: 700;
  }
  .badge.pending { background: #5a3e1c; color: #f6c688; }
  .badge.graded { background: #1f4a31; color: #7dd8a3; }
  .badge.live { background: #4a3a1f; color: #f4d97a; }
  .badge.exam-onboarding { background: rgba(46, 117, 182, 0.2); color: #6fb2e8; }
  .badge.exam-sales { background: rgba(182, 90, 46, 0.2); color: #e89870; }
  .badge.exam-feedback { background: rgba(46, 182, 146, 0.2); color: #6fcbb0; }
  .badge.exam-meta-ads { background: rgba(139, 46, 182, 0.2); color: #b070e0; }
  .badge.exam-flixx { background: rgba(230, 73, 128, 0.2); color: #f080a8; }
  .score-big { font-size: 18px; font-weight: 800; color: #4d9bda; }
  .empty {
    text-align: center; padding: 60px 20px; color: #97a1b8; font-size: 14px;
  }
  /* 채점 화면 */
  .grading-back {
    color: #97a1b8; text-decoration: none; font-size: 14px; cursor: pointer;
    display: inline-block; margin-bottom: 14px;
  }
  .grading-back:hover { color: #e6e9f0; }
  .student-header {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 16px; border-bottom: 1px solid #3a4055; margin-bottom: 18px;
    flex-wrap: wrap; gap: 12px;
  }
  .student-name { font-size: 22px; font-weight: 800; }
  .student-meta { color: #97a1b8; font-size: 13px; }
  .auto-summary {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px; margin-bottom: 20px;
  }
  .summary-card {
    background: #1f2330; padding: 12px 14px; border-radius: 8px;
    border: 1px solid #3a4055;
  }
  .summary-card .label { color: #97a1b8; font-size: 12px; }
  .summary-card .value { font-size: 18px; font-weight: 800; margin-top: 2px; }
  details.qbox {
    background: #1f2330; border: 1px solid #3a4055; border-radius: 8px;
    margin-bottom: 8px; padding: 0;
  }
  details.qbox summary {
    padding: 10px 14px; cursor: pointer; font-size: 13.5px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  details.qbox summary:hover { background: rgba(255,255,255,0.02); }
  details.qbox > div { padding: 0 14px 14px; font-size: 13px; color: #c4ccdb; }
  details.qbox > div > div { padding: 4px 0; }
  .ok { color: #7dd8a3; font-weight: 700; }
  .ng { color: #f17a8a; font-weight: 700; }
  .partial { color: #f6c688; font-weight: 700; }
  /* 서술형 */
  .essay-block {
    background: #1f2330; border: 1px solid #3a4055; border-radius: 10px;
    padding: 16px; margin-bottom: 14px;
  }
  .essay-title { font-size: 15px; font-weight: 700; color: #e6e9f0; margin-bottom: 6px; }
  .essay-scenario { font-size: 12.5px; color: #97a1b8; margin-bottom: 8px; }
  .essay-question {
    font-size: 13.5px; color: #c4ccdb; margin-bottom: 12px;
    padding: 10px; background: rgba(0,0,0,0.15); border-radius: 6px;
  }
  .essay-answer {
    font-size: 13.5px; color: #e6e9f0; padding: 12px; background: rgba(46, 117, 182, 0.06);
    border-left: 3px solid #2e75b6; border-radius: 4px; margin-bottom: 12px;
    white-space: pre-wrap; min-height: 50px;
  }
  .essay-answer.empty-answer { color: #97a1b8; font-style: italic; }
  .rubric { display: flex; flex-direction: column; gap: 8px; }
  .rubric-row {
    display: flex; align-items: center; gap: 10px; padding: 6px 0;
    border-bottom: 1px dashed #3a4055;
  }
  .rubric-row:last-child { border-bottom: 0; }
  .rubric-row label { flex: 1; font-size: 13px; color: #c4ccdb; }
  .rubric-row input[type="number"] {
    width: 64px; padding: 6px 8px; font-size: 14px; text-align: center;
    border-radius: 6px; border: 1px solid #3a4055; background: #1f2330; color: #e6e9f0;
  }
  .essay-total { text-align: right; font-size: 13px; color: #97a1b8; margin-top: 8px; }
  /* memorization (1~3번 시험) 채점 화면 */
  .memo-q {
    background: #1f2330; border: 1px solid #3a4055; border-radius: 8px;
    padding: 14px; margin-bottom: 10px;
  }
  .memo-q-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 12px; margin-bottom: 8px;
  }
  .memo-q-title { font-size: 14px; font-weight: 700; }
  .memo-q-section { font-size: 11px; color: #97a1b8; margin-bottom: 4px; }
  .memo-q-score {
    font-size: 13px; font-weight: 800; color: #4d9bda; white-space: nowrap;
  }
  .memo-q-score.full { color: #7dd8a3; }
  .memo-q-score.partial { color: #f6c688; }
  .memo-q-score.zero { color: #f17a8a; }
  .memo-q-answer {
    font-size: 13px; color: #e6e9f0; padding: 10px;
    background: rgba(46, 117, 182, 0.06); border-left: 3px solid #2e75b6;
    border-radius: 4px; white-space: pre-wrap; min-height: 30px;
  }
  .memo-q-answer.empty-answer { color: #97a1b8; font-style: italic; }
  .memo-q-reference {
    font-size: 12.5px; color: #c4ccdb; padding: 10px;
    background: rgba(255,255,255,0.03); border-left: 3px solid #4a5160;
    border-radius: 4px; white-space: pre-wrap; margin-top: 8px;
  }
  .memo-q-keywords {
    font-size: 11.5px; color: #97a1b8; margin-top: 6px;
  }
  /* 저장 영역 */
  .save-area {
    position: sticky; bottom: 16px; background: #2a2f3e; border-radius: 10px;
    padding: 14px 20px; border: 1px solid #4d9bda;
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 24px; flex-wrap: wrap; gap: 10px;
  }
  .save-area .total-display {
    font-size: 22px; font-weight: 800; color: #7dd8a3;
  }
  /* 정답 자료 관리 */
  .ref-exam { margin-bottom: 18px; }
  .ref-exam h2 { font-size: 16px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ref-slot { background: #1f2330; border: 1px solid #3a4055; border-radius: 8px; padding: 12px 14px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ref-slot .t { font-weight: 700; font-size: 14px; }
  .ref-slot .m { color: #97a1b8; font-size: 12px; margin-top: 2px; }
  .ref-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn.sm { padding: 6px 12px; font-size: 12.5px; }
  .ref-check { font-size: 12.5px; color: #c4ccdb; margin-top: 8px; }
  .ref-check ul { margin: 6px 0 0; padding-left: 18px; color: #f6c688; }
  .ref-text { white-space: pre-wrap; max-height: 420px; overflow: auto; font-size: 12.5px; color: #c4ccdb;
    background: rgba(255,255,255,0.03); border-left: 3px solid #4a5160; border-radius: 4px; padding: 10px; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1f4a31; color: #7dd8a3; padding: 12px 24px; border-radius: 99px;
    font-size: 14px; font-weight: 700; opacity: 0;
    transition: opacity .2s; pointer-events: none; z-index: 1000;
  }
  .toast.show { opacity: 1; }
  @media (max-width: 600px) {
    .auto-summary { grid-template-columns: 1fr 1fr; }
    .student-header { flex-direction: column; align-items: flex-start; }
    th, td { padding: 8px 6px; font-size: 12px; }
    th:nth-child(4), td:nth-child(4),
    th:nth-child(5), td:nth-child(5) { display: none; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- 로그인 화면 -->
  <div id="screen-login">
    <div class="panel login">
      <h1>관리자 로그인</h1>
      <p style="color: #97a1b8; font-size: 14px;">Supabase 어드민 계정으로 로그인하세요.</p>
      <input type="email" id="input-email" placeholder="이메일" autocomplete="username">
      <input type="password" id="input-pw" placeholder="비밀번호" autocomplete="current-password">
      <button class="btn" id="btn-login">로그인</button>
      <div id="login-error" style="margin-top: 12px; color: #f17a8a; font-size: 13px; display: none;"></div>
    </div>
  </div>

  <!-- 응시자 목록 -->
  <div id="screen-list" style="display:none;">
    <h1>응시자 목록</h1>
    <div class="panel">
      <div class="filter-group" id="filter-group">
        <button class="filter-btn active" data-filter="all">전체</button>
        <button class="filter-btn" data-filter="onboarding">온보딩</button>
        <button class="filter-btn" data-filter="sales">세일즈</button>
        <button class="filter-btn" data-filter="feedback">피드백</button>
        <button class="filter-btn" data-filter="meta-ads">메타광고</button>
        <button class="filter-btn" data-filter="flixx">플릭스</button>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
        <span style="color: #97a1b8; font-size: 13px;" id="list-meta">총 0명</span>
        <div style="display: flex; gap: 8px;">
          <button class="btn ghost" id="btn-refs">정답 자료 관리</button>
          <button class="btn ghost" id="btn-refresh">새로고침</button>
          <button class="btn ghost" id="btn-logout">로그아웃</button>
        </div>
      </div>
      <div id="list-container"></div>
    </div>
  </div>

  <!-- 채점 화면 -->
  <div id="screen-grade" style="display:none;"></div>

  <!-- 정답 자료 관리 (백지 시험 답안지 원문 교체·다운로드) -->
  <div id="screen-refs" style="display:none;"></div>

</div>

<div class="toast" id="toast">저장됨</div>

<script src="config.js"></script>
<!-- 메타광고 데이터만 여기서 로드. 나머지 시험은 채점할 때 동적 로드 -->
<script src="exam-data-meta-ads.js"></script>
<!-- 백지 시험(온보딩·세일즈) 채점 기준 — 응시 페이지와 공유 -->
<script src="rubrics.js"></script>
<script>
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============== 시험 종류 메타데이터 ==============
const EXAM_TYPES = {
  "onboarding": { label: "온보딩", emoji: "😊", dataFile: "exam-data-onboarding.js" },
  "sales":      { label: "세일즈", emoji: "🚧", dataFile: "exam-data-sales.js" },
  "feedback":   { label: "피드백", emoji: "📈", dataFile: "exam-data-feedback.js" },
  "meta-ads":   { label: "메타광고", emoji: "📱", dataFile: "exam-data-meta-ads.js" },
  "flixx":      { label: "플릭스", emoji: "🎬", dataFile: "exam-data-flixx.js" },
};

// 동적으로 로드한 시험 데이터를 저장
const examDataCache = {
  "meta-ads": { MCQ, SHORT, ESSAY, STORYLINE, gradeMCQ, gradeShort },
};

// 1~3번 시험 데이터를 동적 로드
async function loadMemorizationData(examType) {
  if (examDataCache[examType]) return examDataCache[examType];
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = EXAM_TYPES[examType].dataFile;
    script.onload = () => {
      // IIFE로 감싼 파일에서 window.examData<Type>으로 노출됨
      const winKey = {
        "onboarding": "examDataOnboarding",
        "sales": "examDataSales",
        "feedback": "examDataFeedback",
        "flixx": "examDataFlixx",
      }[examType];
      const data = window[winKey];
      if (!data) {
        reject(new Error(`window.${winKey}를 찾을 수 없습니다`));
        return;
      }
      examDataCache[examType] = data;
      resolve(data);
    };
    script.onerror = () => reject(new Error("스크립트 로드 실패: " + EXAM_TYPES[examType].dataFile));
    document.head.appendChild(script);
  });
}

// ============== 상태 ==============
let allAttempts = [];
let currentFilter = "all";

// ============== 로그인 / 로그아웃 (Supabase Auth) ==============
function showLoginScreen() {
  document.getElementById("screen-login").style.display = "block";
  document.getElementById("screen-list").style.display = "none";
  document.getElementById("screen-grade").style.display = "none";
  document.getElementById("screen-refs").style.display = "none";
  document.getElementById("input-email").value = "";
  document.getElementById("input-pw").value = "";
  document.getElementById("login-error").style.display = "none";
}

function showListScreen() {
  document.getElementById("screen-login").style.display = "none";
  document.getElementById("screen-list").style.display = "block";
  document.getElementById("screen-grade").style.display = "none";
  document.getElementById("screen-refs").style.display = "none";
  loadList();
}

document.getElementById("btn-login").addEventListener("click", async () => {
  const email = document.getElementById("input-email").value.trim();
  const pw = document.getElementById("input-pw").value;
  const err = document.getElementById("login-error");
  err.style.display = "none";

  if (!email || !pw) {
    err.textContent = "이메일과 비밀번호를 모두 입력하세요.";
    err.style.display = "block";
    return;
  }

  const btn = document.getElementById("btn-login");
  btn.disabled = true;
  btn.textContent = "로그인 중...";
  const { error } = await db.auth.signInWithPassword({ email, password: pw });
  btn.disabled = false;
  btn.textContent = "로그인";

  if (error) {
    err.textContent = "로그인 실패: " + error.message;
    err.style.display = "block";
    return;
  }
  showListScreen();
});

document.getElementById("input-email").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("input-pw").focus();
});
document.getElementById("input-pw").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("btn-login").click();
});

document.getElementById("btn-logout").addEventListener("click", async () => {
  await db.auth.signOut();
  showLoginScreen();
});

document.getElementById("btn-refresh").addEventListener("click", loadList);
document.getElementById("btn-refs").addEventListener("click", openRefs);

db.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT" || !session) showLoginScreen();
});

(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (session) showListScreen();
  else showLoginScreen();
})();

// 필터 버튼
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    renderList();
  });
});

// ============== 응시자 목록 ==============
async function loadList() {
  const { data, error } = await db
    .from("exam_attempts")
    .select("*")
    .order("started_at", { ascending: false });

  if (error) {
    document.getElementById("list-container").innerHTML =
      `<div class="empty">로드 오류: ${escapeHtml(error.message)}</div>`;
    return;
  }
  allAttempts = data;
  renderList();
}

function renderList() {
  const data = currentFilter === "all"
    ? allAttempts
    : allAttempts.filter(a => (a.exam_type || "meta-ads") === currentFilter);

  document.getElementById("list-meta").textContent = `총 ${data.length}명`;

  if (data.length === 0) {
    document.getElementById("list-container").innerHTML =
      `<div class="empty">해당 조건의 응시자가 없습니다.</div>`;
    return;
  }

  const rows = data.map(a => {
    const examType = a.exam_type || "meta-ads";
    const examLabel = EXAM_TYPES[examType]?.label || examType;
    const submitted = !!a.submitted_at;

    // 메타광고: essay/storyline 둘 다 채점 완료여야 graded
    // 1~3번 시험: 제출 시 자동으로 essay_status='graded'로 됨 → 그냥 graded 표시
    const isMetaAds = examType === "meta-ads";
    const fullyGraded = isMetaAds
      ? (a.essay_status === "graded" && a.storyline_status === "graded")
      : (a.essay_status === "graded");

    const statusBadge = submitted
      ? (fullyGraded
          ? '<span class="badge graded">채점 완료</span>'
          : '<span class="badge pending">채점 대기</span>')
      : '<span class="badge live">응시 중</span>';

    return `
      <tr data-id="${a.id}" style="cursor:${submitted ? 'pointer' : 'default'};">
        <td data-label="이름"><b>${escapeHtml(a.name)}</b></td>
        <td data-label="시험"><span class="badge exam-${examType}">${examLabel}</span></td>
        <td data-label="응시일">${a.exam_date}</td>
        <td data-label="제출">${a.submitted_at ? formatTime(a.submitted_at) : "—"}</td>
        <td data-label="상태">${statusBadge}</td>
        <td data-label="자동" class="score-big">${submitted ? a.auto_score : "—"}</td>
        <td data-label="합계" class="score-big">${submitted ? (fullyGraded ? a.total_score : "채점중") : "—"}</td>
      </tr>
    `;
  }).join("");

  document.getElementById("list-container").innerHTML = `
    <div style="overflow-x: auto;">
    <table>
      <thead>
        <tr>
          <th>이름</th><th>시험</th><th>응시일</th><th>제출</th><th>상태</th>
          <th>자동</th><th>합계</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
  `;

  document.querySelectorAll("tbody tr").forEach(tr => {
    const a = data.find(x => x.id === tr.dataset.id);
    if (a && a.submitted_at) {
      tr.addEventListener("click", () => openGrading(a));
    }
  });
}

// ============== 채점 화면 분기 ==============
async function openGrading(attempt) {
  const examType = attempt.exam_type || "meta-ads";
  document.getElementById("screen-list").style.display = "none";
  const grade = document.getElementById("screen-grade");
  grade.style.display = "block";
  grade.innerHTML = '<div class="panel"><p style="color:#97a1b8;">로딩 중...</p></div>';

  try {
    if (examType === "meta-ads") {
      renderMetaAdsGrading(attempt);
    } else if (isBlankAnswers(attempt.essay_answers)) {
      // 백지(blank) 시험: 응시 페이지가 제출 시 auto_score를 계산·저장하고
      // essay_answers 에 원문(script / phone / meeting 등)을 넣는다. 문항별이 아니라 원문을 보여준다.
      renderBlankGrading(attempt, examType);
    } else {
      const data = await loadMemorizationData(examType);
      renderMemorizationGrading(attempt, examType, data);
    }
  } catch (e) {
    grade.innerHTML = `<div class="panel"><p style="color:#f17a8a;">로드 오류: ${escapeHtml(e.message)}</p></div>`;
  }
}

// ====================================================
// PART A. 메타광고 채점 화면 (기존 로직)
// ====================================================
function renderMetaAdsGrading(attempt) {
  const grade = document.getElementById("screen-grade");
  const mcqAnswers = attempt.mcq_answers || {};
  const shortAnswers = attempt.short_answers || {};
  const essayAnswers = attempt.essay_answers || {};
  const existingGrading = attempt.essay_grading || {};
  const storylineAnswer = attempt.storyline_answer || "";
  const existingStoryGrading = attempt.storyline_grading || {};

  const mcqGrade = gradeMCQ(mcqAnswers);
  const shortGrade = gradeShort(shortAnswers);

  // 객관식 상세
  const mcqDetailHtml = MCQ.map((q, i) => {
    const d = mcqGrade.detail.find(x => x.id === q.id);
    const userTxt = d.user ? `${d.user}) ${escapeHtml(q.choices[d.user - 1] || '')}` : "(미응답)";
    const correctTxt = `${q.answer}) ${escapeHtml(q.choices[q.answer - 1])}`;
    const mark = d.ok ? `<span class="ok">정답 (+${q.points})</span>` : `<span class="ng">오답 (0)</span>`;
    return `
      <details class="qbox">
        <summary>
          <span>Q${i + 1}. ${escapeHtml(q.text.slice(0, 60))}${q.text.length > 60 ? '...' : ''}</span>
          <span>${mark}</span>
        </summary>
        <div>
          <div><b>응시자 응답:</b> ${userTxt}</div>
          <div><b>정답:</b> ${correctTxt}</div>
        </div>
      </details>
    `;
  }).join("");

  // 단답형 상세
  const shortDetailHtml = SHORT.map((q, i) => {
    const d = shortGrade.detail.find(x => x.id === q.id);
    const userTxt = d.user.trim() || "(미응답)";
    let mark;
    if (d.earned === q.points) mark = `<span class="ok">만점 (+${d.earned})</span>`;
    else if (d.earned > 0) mark = `<span class="partial">부분 (+${d.earned}/${q.points})</span>`;
    else mark = `<span class="ng">오답 (0/${q.points})</span>`;
    return `
      <details class="qbox">
        <summary>
          <span>Q${MCQ.length + i + 1}. ${escapeHtml(q.text.slice(0, 60))}${q.text.length > 60 ? '...' : ''}</span>
          <span>${mark}</span>
        </summary>
        <div>
          <div><b>응시자 응답:</b> ${escapeHtml(userTxt)}</div>

  // 서술형
  const essayHtml = ESSAY.map((q, i) => {
    const num = MCQ.length + SHORT.length + i + 1;
    const userAns = essayAnswers[q.id] || "";
    const savedScores = existingGrading[q.id] || {};
    const rubricRows = q.rubric.map((r, ri) => {
      const val = savedScores[`r${ri}`] !== undefined ? savedScores[`r${ri}`] : "";
      return `
        <div class="rubric-row">
          <label>${escapeHtml(r.label)}</label>
          <span style="color:#97a1b8; font-size:12px;">/ ${r.max}점</span>

                 data-qid="${q.id}" data-rubric="${ri}" data-max="${r.max}">

    }).join("");

    return `
      <div class="essay-block" data-qid="${q.id}">
        <div class="essay-title">${num}. [${escapeHtml(q.title)}] (${q.points}점)</div>

          <div class="student-meta">응시일 ${attempt.exam_date} · 제출 ${formatTime(attempt.submitted_at)}</div>
        </div>
        <div style="text-align: right;">
          <div style="font-size: 12px; color: #97a1b8;">자동 채점</div>
          <div class="score-big">${attempt.auto_score} / 40</div>
        </div>
      </div>

      <div class="auto-summary">
        <div class="summary-card"><div class="label">객관식</div><div class="value">${mcqGrade.score} / 20</div></div>
        <div class="summary-card"><div class="label">단답형</div><div class="value">${shortGrade.score} / 20</div></div>
        <div class="summary-card"><div class="label">서술형 (수동)</div><div class="value" id="essay-total-display">0 / 30</div></div>
        <div class="summary-card"><div class="label">스토리라인 (수동)</div><div class="value" id="storyline-total-display">0 / 30</div></div>

      ${mcqDetailHtml}

      <p style="font-size:12px; color:#97a1b8; margin:0 0 10px;">키워드 매칭이라 잘못 채점될 수도 있습니다. 모범답안과 비교해보세요.</p>

    el.addEventListener("input", () => recalcMetaAds(attempt.auto_score));
  });

    await saveMetaAdsGrading(attempt.id, attempt.auto_score);
  });

  recalcMetaAds(attempt.auto_score);
  window.scrollTo(0, 0);
  renderGradeExtra(attempt, "meta-ads");

function recalcMetaAds(autoScore) {
  let essayTotal = 0;
  const essayGrading = {};
  ESSAY.forEach(q => {
    let sub = 0;
    const obj = {};
    q.rubric.forEach((r, ri) => {
      const el = document.querySelector(`input[data-qid="${q.id}"][data-rubric="${ri}"]`);
      let v = parseFloat(el.value);
      if (isNaN(v)) v = 0;
      const max = parseFloat(el.dataset.max);
      if (v > max) { v = max; el.value = max; }
      if (v < 0) { v = 0; el.value = 0; }
      obj[`r${ri}`] = v;
      sub += v;
    });
    essayGrading[q.id] = obj;
    document.querySelector(`.essay-subtotal[data-qid="${q.id}"]`).textContent = sub;
    essayTotal += sub;
  });

  let storyTotal = 0;
  const storyGrading = {};
  STORYLINE.rubric.forEach((r, ri) => {
    const el = document.querySelector(`input[data-storyline-rubric="${ri}"]`);
    let v = parseFloat(el.value);
    if (isNaN(v)) v = 0;
    const max = parseFloat(el.dataset.max);
    if (v > max) { v = max; el.value = max; }
    if (v < 0) { v = 0; el.value = 0; }
    storyGrading[`r${ri}`] = v;
    storyTotal += v;
  });

  document.getElementById("essay-total-display").textContent = essayTotal + " / 30";
  document.getElementById("storyline-subtotal").textContent = storyTotal;
  document.getElementById("storyline-total-display").textContent = storyTotal + " / 30";
  const grand = autoScore + essayTotal + storyTotal;
  document.getElementById("grand-total").textContent = grand + " / 100";
  document.getElementById("save-total").textContent = grand + " / 100";
  return { essayTotal, essayGrading, storyTotal, storyGrading };
}

async function saveMetaAdsGrading(attemptId, autoScore) {
  const { essayTotal, essayGrading, storyTotal, storyGrading } = recalcMetaAds(autoScore);
  const btn = document.getElementById("btn-save");
  btn.disabled = true;
  btn.textContent = "저장 중...";
  const { error } = await db.from("exam_attempts").update({
    essay_score: essayTotal,
    essay_grading: essayGrading,
    essay_status: "graded",
    storyline_score: storyTotal,
    storyline_grading: storyGrading,
    storyline_status: "graded",
    graded_at: new Date().toISOString(),
  }).eq("id", attemptId);
  btn.disabled = false;
  btn.textContent = "채점 저장";
  if (error) {
    alert("저장 오류: " + error.message);
    return;
  }
  showToast("저장됨");
}

// essay_answers 가 문항별(q1..)이 아니라 원문 필드(script/phone/meeting/full 등)로 저장된 경우 true
function isBlankAnswers(ans) {
  if (!ans || typeof ans !== "object") return false;
  const keys = Object.keys(ans);
  if (keys.includes("__scores")) return true;
  if (keys.some(k => ["script", "phone", "meeting", "full"].includes(k))) return true;
  return keys.length > 0 && keys.every(k => !/^q\d+$/.test(k));
}

// 채점 화면 하단: (백지 시험) 현재 채점 기준 대비 놓친 항목 + (모든 시험) 답안지 원문
async function renderGradeExtra(attempt, examType) {
  const box = document.getElementById("grade-extra");
  if (!box) return;
  const exam = window.BlankRubrics && BlankRubrics.EXAMS[examType];
  const ans = attempt.essay_answers || {};
  const missHtml = !exam ? "" : `
    <h2 style="font-size:16px; margin: 24px 0 8px;">현재 채점 기준 대비 놓친 항목</h2>
    <p style="font-size: 12.5px; color: #97a1b8; margin: 0 0 10px;">지금 적용된 채점 기준으로 다시 계산한 결과입니다. 이전 기준으로 응시한 경우 위 자동 점수와 다를 수 있습니다.</p>` +
    Object.keys(exam.areas).map(areaKey => {
      const text = areaKey === "all"
        ? Object.keys(ans).filter(k => k !== "__scores" && typeof ans[k] === "string").map(k => ans[k]).join("\n")
        : (ans[areaKey] || "");
      const g = BlankRubrics.gradeArea(text, examType, areaKey);
      return `
        <details class="qbox">
          <summary><span>${escapeHtml(exam.areas[areaKey].label)} — 놓친 항목 ${g.miss.length}개</span>
            <span style="color:#97a1b8; font-size:12px;">현재 기준 ${g.score}/100 (원점수 ${g.raw})</span></summary>
          <div><ul style="margin:0; padding-left:18px; color:#f6c688;">${g.miss.map(p =>
            `<li>${escapeHtml(p.k)} <span style="color:#97a1b8;">(+${p.w})</span></li>`).join("") || "<li>없음</li>"}</ul></div>
        </details>`;
    }).join("");

  let refHtml = "";
  const { data: refs, error } = await db.from("exam_references").select("*").eq("exam_type", examType).order("slot");
  if (error) {
    refHtml = `<p style="font-size:12.5px; color:#97a1b8;">답안지 원문을 불러오지 못했습니다 (${escapeHtml(error.message)}).</p>`;
  } else if (!refs.length) {
    refHtml = `<p style="font-size:12.5px; color:#97a1b8;">등록된 답안지 파일이 없습니다. 목록 화면의 「정답 자료 관리」에서 올려주세요.</p>`;
  } else {
    refHtml = refs.map(r => `
      <details class="qbox">
        <summary><span>📄 ${escapeHtml(r.title)} <span style="color:#97a1b8; font-size:12px;">· ${escapeHtml(r.file_name || "")} · ${formatTime(r.updated_at)}</span></span>
          ${r.storage_path ? `<button class="btn ghost sm" data-ref-dl="${escapeHtml(r.slot)}">PDF 다운로드</button>` : ""}</summary>
        <div><div class="ref-text">${escapeHtml(r.content || "(추출된 텍스트 없음)")}</div></div>
      </details>`).join("");
  }

  box.innerHTML = missHtml + `<h2 style="font-size:16px; margin: 24px 0 8px;">답안지 원문</h2>` + refHtml;
  box.querySelectorAll("[data-ref-dl]").forEach(btn => btn.addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();
    downloadRefFile(refs.find(x => x.slot === btn.dataset.refDl));
  }));
}

function renderMemorizationGrading(attempt, examType, data) {
  const grade = document.getElementById("screen-grade");
  const examLabel = EXAM_TYPES[examType].label;
  const essayAnswers = attempt.essay_answers || {};

  // 자동 채점 다시 돌려서 문항별 상세 가져오기 (저장된 auto_score와 일치할 것)
  const grading = data.autoGradeMemorization(essayAnswers);

  // 문항별 카드
  const qHtml = data.ESSAY_QUESTIONS.map((q, i) => {
    const detail = grading.detail.find(d => d.id === q.id);
    const userAns = (essayAnswers[q.id] || "").trim();
    let scoreClass = "zero";
    if (detail.earned >= q.points) scoreClass = "full";
    else if (detail.earned > 0) scoreClass = "partial";

    return `
      <div class="memo-q">
        <div class="memo-q-head">
          <div style="flex:1;">
            <div class="memo-q-section">${escapeHtml(q.section)}</div>
            <div class="memo-q-title">${i + 1}. ${escapeHtml(q.title)}</div>
          </div>
          <div class="memo-q-score ${scoreClass}">
            ${detail.earned} / ${q.points}
          </div>
        </div>
        <div style="font-size: 12.5px; color: #97a1b8; margin: 6px 0;">${escapeHtml(q.question)}</div>
        <div class="memo-q-answer ${userAns ? '' : 'empty-answer'}">${escapeHtml(userAns) || "(미응답)"}</div>
        <details class="qbox" style="margin-top: 8px;">
          <summary style="font-size: 12px; color: #97a1b8;">모범 답안 펼쳐보기 (키워드 ${detail.matched_groups}/${detail.total_groups} 매칭)</summary>
          <div>
            <div class="memo-q-reference">${escapeHtml(q.answer_text)}</div>
          </div>
        </details>
      </div>
    `;
  }).join("");

  // 수동 가산/감점 입력 (말이 되는지, 문장 구조 평가용)
  const manualAdj = attempt.essay_score || 0;

  grade.innerHTML = `
    <span class="grading-back" id="btn-back">← 목록으로 돌아가기</span>
    <div class="panel">
      <div class="student-header">
        <div>
          <div class="student-name">${escapeHtml(attempt.name)} <span class="badge exam-${examType}" style="font-size:12px; vertical-align: middle;">${escapeHtml(examLabel)}</span></div>
          <div class="student-meta">응시일 ${attempt.exam_date} · 제출 ${formatTime(attempt.submitted_at)}</div>
        </div>
        <div style="text-align: right;">
          <div style="font-size: 12px; color: #97a1b8;">자동 채점 (키워드)</div>
          <div class="score-big">${attempt.auto_score} / 100</div>
        </div>
      </div>

      <div class="auto-summary">
        <div class="summary-card"><div class="label">키워드 자동</div><div class="value">${attempt.auto_score} / 100</div></div>
        <div class="summary-card"><div class="label">수동 가산/감점</div><div class="value" id="manual-display">${manualAdj} 점</div></div>
        <div class="summary-card"><div class="label">최종</div><div class="value" id="grand-total" style="color:#7dd8a3;">${attempt.auto_score + manualAdj} / 100</div></div>
      </div>

      <div class="panel" style="background: rgba(46, 117, 182, 0.1); border-color: #2e75b6; padding: 14px 18px;">
        <div style="font-size: 14px; font-weight: 700; margin-bottom: 6px;">수동 가산/감점</div>
        <p style="font-size: 12.5px; color: #c4ccdb; margin: 0 0 10px;">
          자동 채점은 키워드 매칭 기준입니다. 답안이 말이 되는지, 문장 구조가 잘 작성되었는지를 보고 가산/감점하세요.
          (음수 입력 시 감점)
        </p>
        <div style="display: flex; gap: 10px; align-items: center;">
          <label style="color:#97a1b8; font-size:13px;">가산/감점 점수:</label>
          <input type="number" id="manual-input" step="0.5" value="${manualAdj}"
                 style="width: 80px; padding: 8px 10px; font-size: 14px; text-align: center;
                        border-radius: 6px; border: 1px solid #3a4055; background: #1f2330; color: #e6e9f0;">
          <span style="color:#97a1b8; font-size:12px;">점 (자동 점수에 더해짐)</span>
        </div>
      </div>

      <h2 style="font-size:16px; margin: 24px 0 12px;">문항별 답안 검토</h2>
      <p style="font-size: 12.5px; color: #97a1b8; margin: 0 0 12px;">
        문항별로 답안을 살펴보고, 위 가산/감점 점수에 반영하세요.
      </p>
      ${qHtml}

      <div id="grade-extra"></div>

      <div class="save-area">
        <div>
          <div style="font-size:12px;color:#97a1b8;">최종 점수</div>
          <div class="total-display" id="save-total">${attempt.auto_score + manualAdj} / 100</div>
        </div>
        <button class="btn success" id="btn-save">채점 저장</button>
      </div>
    </div>
  `;

  document.getElementById("btn-back").addEventListener("click", goBack);
  document.getElementById("manual-input").addEventListener("input", () => recalcMemo(attempt.auto_score));
  document.getElementById("btn-save").addEventListener("click", () => saveMemoGrading(attempt.id, attempt.auto_score));

  recalcMemo(attempt.auto_score);
  window.scrollTo(0, 0);
  renderGradeExtra(attempt, examType);
}

function recalcMemo(autoScore) {
  const input = document.getElementById("manual-input");
  let v = parseFloat(input.value);
  if (isNaN(v)) v = 0;
  // 자동점수 + 수동조정이 100을 넘지 않도록 (단, 음수는 허용)
  const maxAdj = 100 - autoScore;
  if (v > maxAdj) { v = maxAdj; input.value = maxAdj; }
  if (v < -autoScore) { v = -autoScore; input.value = v; }

  document.getElementById("manual-display").textContent = v + " 점";
  const grand = autoScore + v;
  document.getElementById("grand-total").textContent = grand + " / 100";
  document.getElementById("save-total").textContent = grand + " / 100";
  return v;
}

async function saveMemoGrading(attemptId, autoScore) {
  const v = recalcMemo(autoScore);
  const btn = document.getElementById("btn-save");
  btn.disabled = true;
  btn.textContent = "저장 중...";
  const { error } = await db.from("exam_attempts").update({
    essay_score: v,
    essay_status: "graded",
    storyline_score: 0,
    storyline_status: "graded",  // 1~3번 시험엔 스토리라인 없음 → 0점 graded로 처리
    graded_at: new Date().toISOString(),
  }).eq("id", attemptId);
  btn.disabled = false;
  btn.textContent = "채점 저장";
  if (error) {
    alert("저장 오류: " + error.message);
    return;
  }
  showToast("저장됨");
}

// PART C. 정답 자료 관리 — 시험별 원문 파일(여러 개) 교체·삭제 + 현재 답안지 다운로드
// ====================================================
// 원문 파일: 원본은 Storage(비공개 버킷), 추출 텍스트는 exam_references 에 저장.
// 답안지 다운로드는 지금 적용 중인 채점 기준(rubrics.js / exam-data-*.js)으로 만든다.
// 파일 교체만으로 자동 채점 키워드는 바뀌지 않으므로, 백지 시험은 새 원문에 없는 채점 항목을 표시한다.
const REF_BUCKET = "exam-references";
const REF_EXAMS = ["onboarding", "sales", "feedback", "meta-ads", "flixx"];
// 고정 슬롯: 영역(area)별 원문 비교에 쓰는 지정 파일. 나머지 파일은 area "*" (전 영역 공통)
const REF_PRESETS = [
  { slot: "onboarding-1", exam: "onboarding", area: "all",     title: "온보딩1. 진행",         match: /온보딩\s*1/ },
  { slot: "onboarding-2", exam: "onboarding", area: "all",     title: "온보딩2. 방어 스크립트", match: /온보딩\s*2/ },
  { slot: "sales-1",      exam: "sales",      area: "meeting", title: "세일즈1. 온라인 미팅",   match: /세일즈\s*1/ },
  { slot: "sales-2",      exam: "sales",      area: "phone",   title: "세일즈2. 전화",         match: /세일즈\s*2/ },
];
// 여러 파일 한 번에 올릴 때 파일명으로 시험 찾기
const REF_NAME_HINTS = [
  { exam: "onboarding", re: /온보딩/ }, { exam: "sales", re: /세일즈/ }, { exam: "feedback", re: /피드백/ },
  { exam: "meta-ads", re: /메타/ }, { exam: "flixx", re: /플릭스|flixx/i },
];
let refRows = [];

async function openRefs() {
  document.getElementById("screen-list").style.display = "none";
  document.getElementById("screen-grade").style.display = "none";
  const box = document.getElementById("screen-refs");
  box.style.display = "block";
  box.innerHTML = '<div class="panel"><p style="color:#97a1b8;">로딩 중...</p></div>';
  const error = await reloadRefRows();
  renderRefs(error);
  window.scrollTo(0, 0);
}

async function reloadRefRows() {
  const { data, error } = await db.from("exam_references").select("*").order("updated_at");
  refRows = error ? [] : data;
  return error;
}

function refRowHtml(def, r) {
  const meta = r
    ? `${escapeHtml(r.file_name || "-")} · ${formatTime(r.updated_at)} · 텍스트 ${(r.content || "").length.toLocaleString()}자`
    : "아직 등록된 파일이 없습니다";
  return `
    <div class="ref-slot">
      <div><div class="t">${escapeHtml(def.title)}</div><div class="m">${meta}</div></div>
      <div class="ref-actions">
        ${r && r.storage_path ? `<button class="btn ghost sm" data-dl-file="${def.slot}">원본 다운로드</button>` : ""}
        ${r ? `<button class="btn ghost sm" data-dl-text="${def.slot}">텍스트(.txt)</button>` : ""}
        <label class="btn sm" style="display:inline-block;">${r ? "교체" : "올리기"}
          <input type="file" accept=".pdf,.txt,.md" data-replace="${def.slot}" style="display:none;"></label>
        ${r ? `<button class="btn ghost sm" style="color:#f17a8a;" data-del="${def.slot}">삭제</button>` : ""}
      </div>
    </div>`;
}

function renderRefs(loadError) {
  const box = document.getElementById("screen-refs");
  const examHtml = REF_EXAMS.map(examType => {
    const presets = REF_PRESETS.filter(p => p.exam === examType);
    const presetHtml = presets.map(def => refRowHtml(def, refRows.find(r => r.slot === def.slot))).join("");
    const extraHtml = refRows
      .filter(r => r.exam_type === examType && !presets.some(p => p.slot === r.slot))
      .map(r => refRowHtml({ slot: r.slot, title: r.title }, r)).join("");
    const empty = !presetHtml && !extraHtml
      ? `<div class="m" style="color:#97a1b8; font-size:12.5px; margin-bottom:8px;">등록된 답안지 파일이 없습니다.</div>` : "";
    return `
      <div class="panel ref-exam">
        <h2><span>${EXAM_TYPES[examType].emoji} ${EXAM_TYPES[examType].label} 답안지</span>
          <span class="ref-actions">
            <button class="btn success sm" data-dl-originals="${examType}">답안지 PDF 다운로드</button>
            <button class="btn ghost sm" data-dl-sheet="${examType}">채점 기준표 (PDF)</button>
          </span></h2>
        ${presetHtml}${extraHtml}${empty}
        <label class="btn ghost sm" style="display:inline-block; margin-top:4px;">+ 답안지 파일 추가 (여러 개 선택 가능)
          <input type="file" accept=".pdf,.txt,.md" multiple data-add="${examType}" style="display:none;"></label>
        <div class="ref-check">${coverageHtml(examType)}</div>
      </div>`;
  }).join("");

  box.innerHTML = `
    <span class="grading-back" id="btn-refs-back">← 목록으로 돌아가기</span>
    <h1>정답 자료 관리</h1>
    ${loadError ? `<div class="panel" style="border-color:#f17a8a; color:#f6c6cc; font-size:13px;">
      정답 자료 테이블을 불러오지 못했습니다: ${escapeHtml(loadError.message)}<br>
      Supabase SQL Editor 에서 <b>references.sql</b> 을 한 번 실행한 뒤 새로고침하세요. (답안지 다운로드는 지금도 가능)</div>` : ""}
    <div class="panel" style="font-size:13px; color:#c4ccdb;">
      <b>답안지 PDF 다운로드</b>: 올려둔 답안지 원본 PDF를 그대로 받습니다 (여러 개면 전부). 올린 파일이 없으면 피드백·메타광고·플릭스는 현재 시험의 모범 답안으로 PDF를 만들어 드립니다.<br>
      <b>채점 기준표 (PDF)</b>: 지금 실제로 채점에 쓰는 정답·배점·인정 키워드를 정리한 PDF입니다.<br>
      답안지 파일은 시험별로 여러 개 올리고, 교체·삭제할 수 있습니다. 채점 화면에서도 원문을 보여줍니다.
      <div style="margin-top:10px;"><label class="btn sm" style="display:inline-block;">여러 시험 파일 한 번에 올리기
        <input type="file" accept=".pdf,.txt,.md" multiple id="ref-bulk" style="display:none;"></label>
        <span style="margin-left:8px; color:#97a1b8; font-size:12px;">파일명(온보딩1·온보딩2·세일즈1·세일즈2 / 피드백·메타·플릭스)으로 시험을 찾습니다</span>
        <div id="ref-status" style="margin-top:6px; color:#97a1b8;"></div></div>
      <p style="margin:10px 0 0; color:#97a1b8; font-size:12px;">
        ※ 원문 파일을 바꿔도 자동 채점 키워드는 그대로입니다. 백지 시험(온보딩·세일즈·플릭스)은 「원문에 없는 채점 항목」이 뜨면 채점 기준 갱신이 필요합니다.</p>
    </div>
    ${examHtml}`;

  document.getElementById("btn-refs-back").addEventListener("click", showListScreen);
  box.querySelectorAll("[data-replace]").forEach(inp => inp.addEventListener("change", async () => {
    const slot = inp.dataset.replace;
    const preset = REF_PRESETS.find(p => p.slot === slot);
    const row = refRows.find(r => r.slot === slot);
    const def = preset || { slot, exam: row.exam_type, area: row.area, title: row.title };
    if (inp.files[0]) await uploadRefs([[def, inp.files[0]]]);
  }));
  box.querySelectorAll("[data-add]").forEach(inp => inp.addEventListener("change", async () => {
    const examType = inp.dataset.add;
    await uploadRefs([...inp.files].map((f, i) => [refDefForFile(examType, f, i), f]));
  }));
  document.getElementById("ref-bulk").addEventListener("change", async e => {
    const pairs = [], unknown = [];
    [...e.target.files].forEach((f, i) => {
      const name = f.name.normalize("NFC");
      const preset = REF_PRESETS.find(p => p.match.test(name));
      const hint = REF_NAME_HINTS.find(h => h.re.test(name));
      if (preset || hint) pairs.push([refDefForFile((preset || hint).exam, f, i), f]); else unknown.push(f.name);
    });
    if (unknown.length) alert("파일명으로 시험을 찾지 못해 건너뜀:\n" + unknown.join("\n") + "\n\n각 시험 카드의 「+ 원문 파일 추가」로 올려주세요.");
    if (pairs.length) await uploadRefs(pairs);
  });
  box.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => deleteRef(b.dataset.del)));
  box.querySelectorAll("[data-dl-file]").forEach(b => b.addEventListener("click", () =>
    downloadRefFile(refRows.find(r => r.slot === b.dataset.dlFile))));
  box.querySelectorAll("[data-dl-text]").forEach(b => b.addEventListener("click", () => {
    const r = refRows.find(x => x.slot === b.dataset.dlText);
    saveBlob(new Blob([r.content || ""], { type: "text/plain;charset=utf-8" }), r.title + ".txt");
  }));
  box.querySelectorAll("[data-dl-sheet]").forEach(b => b.addEventListener("click", () => downloadAnswerSheetPdf(b.dataset.dlSheet, b)));
  box.querySelectorAll("[data-dl-originals]").forEach(b => b.addEventListener("click", () => downloadExamOriginals(b.dataset.dlOriginals, b)));
}

// 파일 하나를 어느 슬롯에 넣을지: 고정 슬롯 파일명이면 그 슬롯(교체), 아니면 새 슬롯 추가
function refDefForFile(examType, file, i) {
  const name = file.name.normalize("NFC");
  const preset = REF_PRESETS.find(p => p.exam === examType && p.match.test(name));
  if (preset) return preset;
  return { slot: `${examType}-${Date.now().toString(36)}${i}`, exam: examType, area: "*", title: name.replace(/\.[^.]+$/, "") };
}

// 원문(해당 영역 + 공통 파일 텍스트 합본)에서 찾을 수 없는 채점 항목 — 백지 시험만
function coverageHtml(examType) {
  const exam = BlankRubrics.EXAMS[examType];
  if (!exam) return "";
  return Object.keys(exam.areas).map(areaKey => {
    const texts = refRows.filter(r => r.exam_type === examType && (r.area === areaKey || r.area === "*")).map(r => r.content || "");
    const label = exam.areas[areaKey].label;
    if (!texts.length) return `<div>${escapeHtml(label)}: 원문 미등록 — 비교 불가</div>`;
    const norm = BlankRubrics.normalize(texts.join("\n"));
    const points = BlankRubrics.flatten(exam.areas[areaKey].sections);
    const missing = points.filter(p => !BlankRubrics.pointHit(norm, p));
    if (!missing.length) return `<div>✅ ${escapeHtml(label)}: 채점 항목 ${points.length}개 모두 원문과 일치</div>`;
    return `<div>⚠️ ${escapeHtml(label)}: 원문에 없는 채점 항목 ${missing.length}개 (채점 기준 갱신 필요)
      <ul>${missing.map(p => `<li>${escapeHtml(p.k)}</li>`).join("")}</ul></div>`;
  }).join("");
}

async function uploadRefs(pairs) {
  const status = document.getElementById("ref-status");
  let ok = 0;
  for (const [def, file] of pairs) {
    try {
      status.textContent = `${def.title} — 텍스트 추출 중...`;
      const isPdf = /\.pdf$/i.test(file.name) || file.type === "application/pdf";
      const content = redactSecrets(isPdf ? await extractPdfText(file) : await file.text());
      const ext = isPdf ? "pdf" : (file.name.split(".").pop() || "txt").toLowerCase();
      const path = `${def.slot}.${ext}`;
      status.textContent = `${def.title} — 업로드 중...`;
      const up = await db.storage.from(REF_BUCKET).upload(path, file,
        { upsert: true, contentType: file.type || (isPdf ? "application/pdf" : "text/plain") });
      if (up.error) throw up.error;
      const old = refRows.find(r => r.slot === def.slot);
      if (old && old.storage_path && old.storage_path !== path) await db.storage.from(REF_BUCKET).remove([old.storage_path]);
      const { error } = await db.from("exam_references").upsert({
        slot: def.slot, exam_type: def.exam, area: def.area, title: def.title,
        file_name: file.name.normalize("NFC"), storage_path: path, content, updated_at: new Date().toISOString(),
      });
      if (error) throw error;
      ok++;
    } catch (e) {
      alert(`${def.title} 업로드 실패: ${e.message}`);
    }
  }
  status.textContent = "";
  await reloadRefRows();
  renderRefs();
  if (ok) showToast(`${ok}개 저장됨`);
}

async function deleteRef(slot) {
  const r = refRows.find(x => x.slot === slot);
  if (!r || !confirm(`「${r.title}」 원문 파일을 삭제할까요? 되돌릴 수 없습니다.`)) return;
  if (r.storage_path) {
    const rm = await db.storage.from(REF_BUCKET).remove([r.storage_path]);
    if (rm.error) { alert("파일 삭제 실패: " + rm.error.message); return; }
  }
  const { error } = await db.from("exam_references").delete().eq("slot", slot);
  if (error) { alert("삭제 실패: " + error.message); return; }
  await reloadRefRows();
  renderRefs();
  showToast("삭제됨");
}

// 내부 계정 비밀번호가 원문 텍스트에 남지 않도록 가림 (원본 PDF는 비공개 버킷에만 보관)
function redactSecrets(text) {
  return text.replace(/\u0000/g, ":").replace(/((?:password|pw)\s*[:：]\s*)\S+/gi, "$1(비공개)");
}

function loadScriptOnce(src, globalName) {
  if (window[globalName]) return Promise.resolve(window[globalName]);
  return new Promise((resolve, reject) => {
    const sc = document.createElement("script");
    sc.src = src;
    sc.onload = () => resolve(window[globalName]);
    sc.onerror = () => { sc.remove(); reject(new Error("라이브러리 로드 실패: " + src)); };
    document.head.appendChild(sc);
  });
}
async function extractPdfText(file) {
  const pdfjs = await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js", "pdfjsLib");
  pdfjs.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
  const pages = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const tc = await (await doc.getPage(i)).getTextContent();
    pages.push(tc.items.map(it => it.str + (it.hasEOL ? "\n" : "")).join(""));
  }
  return pages.join("\n\n").replace(/\n{3,}/g, "\n\n").trim();
}

async function downloadRefFile(r) {
  if (!r || !r.storage_path) return;
  const { data, error } = await db.storage.from(REF_BUCKET).download(r.storage_path);
  if (error) { alert("다운로드 실패: " + error.message); return; }
  saveBlob(data, r.file_name || r.storage_path);
}

// ---------- 현재 답안지 (채점 기준) ----------
// 시험 종류별로 { title, note, blocks:[{ heading, items:[{ head, meta, lines:[[라벨, 내용]] }] }] } 형태로 정리
// 모범 답안 버전 — 업로드한 원본 PDF가 없을 때 「답안지 PDF 다운로드」가 대신 만든다.
// 온보딩·세일즈는 문항형 모범답안이 없으므로 null (원본 PDF 업로드 필요)
async function buildModelAnswerSheet(examType) {
  const label = EXAM_TYPES[examType].label;
  if (examType === "feedback" || examType === "flixx") {
    const data = await loadMemorizationData(examType);
    const bySection = {};
    data.ESSAY_QUESTIONS.forEach((q, i) => {
      (bySection[q.section] = bySection[q.section] || []).push({ head: `${i + 1}. ${q.title}`, meta: `${q.points}점`,
        lines: [["문제", q.question], ["모범 답안", q.answer_text]] });
    });
    return { title: `${label} 답안지`,
      note: examType === "flixx"
        ? "문항별 모범 답안. 실제 시험은 백지 1영역으로 작성하며, 자동 채점 키워드는 「채점 기준표 (PDF)」를 참고하세요."
        : "문항별 모범 답안. 자동 채점 키워드는 「채점 기준표 (PDF)」를 참고하세요.",
      blocks: Object.keys(bySection).map(h => ({ heading: h, items: bySection[h] })) };
  }
  if (examType === "meta-ads") {
    const sheet = await buildAnswerSheet("meta-ads");
    return Object.assign(sheet, { title: `${label} 답안지` });
  }
  return null;
}

async function buildAnswerSheet(examType) {
  const label = EXAM_TYPES[examType].label;
  const blank = BlankRubrics.EXAMS[examType];
  if (blank) {
    const blocks = [];
    Object.keys(blank.areas).forEach(areaKey => {
      const area = blank.areas[areaKey];
      area.sections.forEach(sec => blocks.push({
        heading: (Object.keys(blank.areas).length > 1 ? area.label + " · " : "") + sec.title,
        items: sec.points.map(p => ({ head: p.k, meta: `${p.w}점`,
          lines: [["인정 키워드", p.any.map(pat => pat.join(" + ")).join("  |  ")]] })),
      }));
    });
    return { title: `${label} 채점 기준표 (백지 시험)`,
      note: `키워드 자동 채점 — 「+」는 모두 포함, 「|」는 그중 하나. 원점수 ${blank.anchorRaw} → ${blank.anchorScore}점으로 보정 (그 이상은 100점까지 비례).`,
      blocks };
  }
  if (examType === "feedback") {
    const data = await loadMemorizationData("feedback");
    const bySection = {};
    data.ESSAY_QUESTIONS.forEach((q, i) => {
      (bySection[q.section] = bySection[q.section] || []).push({ head: `${i + 1}. ${q.title}`, meta: `${q.points}점`,
        lines: [["문제", q.question], ["모범 답안", q.answer_text],
                ["인정 키워드", (q.keywords || []).map(g => g.join(" / ")).join("  +  ")]] });
    });
    return { title: `${label} 채점 기준표`, note: "서술식 암기 — 키워드 그룹 매칭 비율로 자동 채점 + 수동 가산/감점.",
      blocks: Object.keys(bySection).map(h => ({ heading: h, items: bySection[h] })) };
  }
  if (examType === "meta-ads") {
    let n = 0;
    return { title: `${label} 채점 기준표`, note: "객관식·단답형은 자동 채점, 서술형·스토리라인은 루브릭 수동 채점.",
      blocks: [
        { heading: "PART 1. 객관식", items: MCQ.map(q => ({ head: `${++n}. ${q.text}`, meta: `${q.points}점`,
          lines: [["보기", q.choices.map((c, i) => `${i + 1}) ${c}`).join("\n")], ["정답", `${q.answer}) ${q.choices[q.answer - 1]}`]] })) },
        { heading: "PART 2. 단답형", items: SHORT.map(q => ({ head: `${++n}. ${q.text}`, meta: `${q.points}점`,
          lines: [["모범 답안", q.answer_text]] })) },
        { heading: "PART 3. 서술형", items: ESSAY.map(q => ({ head: `${++n}. ${q.title}`, meta: `${q.points}점`,
          lines: [["상황", q.scenario], ["문제", q.question], ["채점 기준", q.rubric.map(r => `${r.label} (${r.max}점)`).join("\n")]] })) },
        { heading: "PART 4. 스토리라인", items: [{ head: `${++n}. ${STORYLINE.title}`, meta: `${STORYLINE.points}점`,
          lines: [["브리핑", STORYLINE.brief], ["문제", STORYLINE.question],
                  ["채점 기준", STORYLINE.rubric.map(r => `${r.label} (${r.max}점)${r.detail ? " — " + r.detail : ""}`).join("\n")],
                  ["모범 답안 예시", STORYLINE.reference_example || ""]] }] },
      ] };
  }
  throw new Error("답안지를 만들 수 없는 시험: " + examType);
}

async function downloadAnswerSheetPdf(examType, btn, mode) {
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = "PDF 만드는 중...";
  try {
    const sheet = mode === "answers" ? await buildModelAnswerSheet(examType) : await buildAnswerSheet(examType);
    const html2pdf = await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js", "html2pdf");
    const today = new Date().toISOString().slice(0, 10);
    const sources = refRows.filter(r => r.exam_type === examType).map(r => r.file_name || r.title);
    const el = document.createElement("div");
    el.style.cssText = "width:760px; padding:8px 4px; background:#fff; color:#1f2330; font-family:'맑은 고딕','Malgun Gothic',sans-serif; font-size:12px; line-height:1.55;";
    el.innerHTML = `
      <h1 style="font-size:20px; margin:0 0 4px;">${escapeHtml(sheet.title)}</h1>
      <div style="color:#6b7180; font-size:11px; margin-bottom:6px;">기준일 ${today}${sources.length ? " · 원문: " + escapeHtml(sources.join(", ")) : ""}</div>
      <div style="background:#f0f3fa; border-radius:6px; padding:8px 10px; font-size:11px; color:#4a5160; margin-bottom:12px;">${escapeHtml(sheet.note)}</div>
      ${sheet.blocks.map(b => `
        <h2 style="font-size:14px; margin:16px 0 6px; padding-bottom:4px; border-bottom:2px solid #2e75b6;">${escapeHtml(b.heading)}</h2>
        ${b.items.map(it => `
          <div class="ak-item" style="border:1px solid #e3e7ef; border-radius:6px; padding:7px 10px; margin-bottom:6px;">
            <div style="display:flex; justify-content:space-between; gap:10px; font-weight:700;">
              <span style="white-space:pre-wrap;">${escapeHtml(it.head)}</span><span style="color:#2e75b6; white-space:nowrap;">${escapeHtml(it.meta)}</span></div>
            ${it.lines.filter(l => l[1]).map(l => `
              <div style="margin-top:3px; font-size:11.5px;"><span style="color:#6b7180;">${escapeHtml(l[0])}</span>
                <div style="white-space:pre-wrap;">${escapeHtml(l[1])}</div></div>`).join("")}
          </div>`).join("")}`).join("")}`;
    document.body.appendChild(el);
    await html2pdf().set({
      margin: [10, 10, 12, 10],
      filename: `${EXAM_TYPES[examType].label}_${mode === "answers" ? "답안지" : "채점기준표"}_${today}.pdf`,
      image: { type: "jpeg", quality: 0.95 },
      html2canvas: { scale: 2, backgroundColor: "#ffffff" },
      jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
      pagebreak: { mode: ["css", "legacy"], avoid: [".ak-item", "h2"] },
    }).from(el).save();
    el.remove();
  } catch (e) {
    alert("PDF 생성 실패: " + e.message);
  } finally {
    btn.disabled = false; btn.textContent = orig;
  }
}

// 시험에 등록된 답안지 원본 파일 전부 다운로드
async function downloadExamOriginals(examType, btn) {
  const rows = refRows.filter(r => r.exam_type === examType && r.storage_path);
  if (!rows.length) {
    if (["feedback", "meta-ads", "flixx"].includes(examType)) { await downloadAnswerSheetPdf(examType, btn, "answers"); return; }
    alert(EXAM_TYPES[examType].label + " 답안지 원본 PDF가 아직 없습니다. 「+ 답안지 파일 추가」로 올려주세요.");
    return;
  }
  for (const r of rows) { await downloadRefFile(r); await new Promise(res => setTimeout(res, 400)); }
}

function saveBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function goBack() {
  document.getElementById("screen-grade").style.display = "none";
  document.getElementById("screen-list").style.display = "block";

function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 1500);
}

function formatTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return `${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

function escapeHtml(s) {
  return (s || "").toString().replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}
